apis:
- name: Kymeta Connect Platform API
  description: >-
    Kymeta's first-party API host for the Kymeta Connect service platform, which backs the Kymeta
    Access app and the Kymeta Access Portal. The host answers unauthenticated on three operational
    endpoints only — /health, /version and /status — and 404s every specification path probed. Its
    own /status roll-up names the ten services behind the gateway: accounts, activityLogger,
    enterpriseBroker, fileStorage, logicApp, remoteMetrics, scheduler, subscriptions, users and
    devices. Every functional endpoint is gated behind the OAuth 2.0 server at access.kymeta.io;
    Kymeta publishes no OpenAPI, no reference and no getting-started guide for it.
  humanURL: https://www.kymetacorp.com/support/app
  baseURL: https://api.kymeta.io
  tags:
  - Satellite Communications
  - Connectivity
  - Remote Monitoring
  properties:
  - type: Authentication
    url: authentication/kymeta-authentication.yml
  - type: OAuthScopes
    url: scopes/kymeta-scopes.yml
- name: Kymeta Access Identity
  description: >-
    Kymeta's own OAuth 2.0 / OpenID Connect authorization server (issuer https://access.kymeta.io),
    the single sign-on point for the Kymeta Access Portal, Kymeta Academy and Grapevine. It
    publishes a live OIDC discovery document and JWKS, supports authorization code with PKCE,
    client credentials, refresh token, implicit and device code grants, and advertises eleven
    scopes including a named partners-api scope. The discovery document is the only
    machine-readable contract Kymeta publishes anywhere.
  humanURL: https://access.kymeta.io/
  baseURL: https://access.kymeta.io
  tags:
