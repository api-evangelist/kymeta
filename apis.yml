aid: kymeta
name: Kymeta
description: >-
  Kymeta Corporation is a Redmond, Washington satellite communications company that builds
  electronically steered, flat-panel metamaterial antennas and the connectivity service that runs
  behind them. Spun out of Intellectual Ventures in 2012 from metamaterials research begun at Duke
  University, Kymeta ships the u8 terminal family — Osprey u8, Goshawk u8, Peregrine u8, Hawk u8
  and the compact Kestrel u5 — for military and government, maritime, land-mobile, energy and
  humanitarian users who need multi-orbit GEO/LEO connectivity on the move. The hardware is paired
  with Kymeta Connect, a software-defined service platform reached through the Kymeta Access app
  and the Kymeta Access Portal, which handles terminal management, subscriptions, usage metrics and
  remote monitoring. Kymeta operates a first-party API host and its own OAuth 2.0 / OpenID Connect
  identity provider, but publishes no public developer program, API reference or machine-readable
  contract; product documentation and release notices require a Kymeta Access Portal account.
